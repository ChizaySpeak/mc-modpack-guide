    // Safe Lucide icon wrapper for browser runtime
    function Icon({ name, className = 'w-4 h-4' }) {
      const iconRef = useRef(null);

      useEffect(() => {
        try {
          if (!iconRef.current || !window.lucide || !window.lucide.icons) return;
          const pascalName = name
            .split('-')
            .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
            .join('');
          const iconData = window.lucide.icons[pascalName];
          if (!iconData) return;

          iconRef.current.innerHTML = '';
          const svgEl = window.lucide.createElement(iconData);
          if (className) {
            className
              .split(' ')
              .filter(Boolean)
              .forEach((cls) => svgEl.classList.add(cls));
          }
          iconRef.current.appendChild(svgEl);
        } catch {
          // Ignore icon rendering issues gracefully
        }
      }, [name, className]);

      return (
        <span
          ref={iconRef}
          className="inline-flex items-center justify-center shrink-0"
          aria-hidden="true"
        />
      );
    }

                      <span>Только «уточнить»</span>
                    </button>
                  </div>
                </div>

                {/* Results counter */}
                <div className="flex flex-wrap items-center justify-between gap-2 px-1 text-xs text-slate-400">
                  <span>
                    Показано карточек: <strong className="text-slate-200">{filteredMods.length}</strong>
                  </span>
                  <span className="text-[11px] text-slate-500">
                    Нажмите на карточку, чтобы открыть инструкцию
                  </span>
                </div>

                {/* Mod cards */}
                {filteredMods.length === 0 ? (
                  <div className="rounded-2xl bg-slate-900/60 border border-slate-800 p-10 text-center space-y-2">
                    <Icon name="search" className="w-8 h-8 text-slate-500 mx-auto" />
                    <p className="text-sm font-semibold text-slate-200">Ничего не найдено</p>
                    <p className="text-xs text-slate-400">
                      Попробуйте сбросить фильтры или изменить поисковый запрос.
                    </p>
                    <button
                      type="button"
                      onClick={() => {
                        setSelectedCategory('all');
                        setOnlyClarify(false);
                        setSearchQuery('');
                      }}
                      className="mt-2 inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold transition"
                    >
                      Сбросить фильтры
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                    {filteredMods.map((mod) => (
                      <article
                        key={mod.id}
                        onClick={() => setSelectedMod(mod)}
                        className="group rounded-2xl bg-slate-900/75 hover:bg-slate-900 border border-slate-800/90 hover:border-purple-500/40 p-4 transition cursor-pointer shadow-lg flex flex-col justify-between"
                      >
                        <div>
                          <div className="flex items-start justify-between gap-2 mb-2">
                            <h2 className="text-sm sm:text-base font-bold text-slate-100 group-hover:text-purple-300 transition leading-snug">
                              {mod.title}
                            </h2>
                            <span
                              className={`shrink-0 whitespace-nowrap text-[10px] font-semibold px-2.5 py-0.5 rounded-full border ${mod.diffColor}`}
                            >
                              {mod.difficulty}
                            </span>
                          </div>
                          <p className="text-xs text-slate-400 leading-relaxed line-clamp-3 mb-3">
                            {mod.summary}
                          </p>
                        </div>

                        <div className="pt-2.5 border-t border-slate-800/70 flex items-center justify-between gap-2 text-[11px]">
                          <span className="text-slate-400 truncate">{mod.roleLabel}</span>
                          <span className="text-purple-400 font-semibold shrink-0 group-hover:translate-x-0.5 transition">
                            Открыть &rarr;
                          </span>
                        </div>
                      </article>
                    ))}
                  </div>
                )}
              </section>
            )}

            {/* SECTION: FIRST DAY CHECKLIST */}
            {activeTab === 'first-day' && (
              <section className="space-y-3.5">
                <div className="rounded-2xl bg-gradient-to-br from-purple-950/60 via-slate-900/85 to-slate-900/85 border border-purple-500/30 p-5 shadow-xl">
                  <h2 className="text-base font-bold text-white flex items-center gap-2 mb-1.5">
                    <Icon name="zap" className="w-5 h-5 text-amber-400" />
                    Чек-лист первого дня на сервере
                  </h2>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    Не пытайтесь изучить все 163 мода сразу. Отмечайте выполненные шаги по мере старта, выберите роль и играйте в своём темпе.
                  </p>
                </div>

                <div className="space-y-2.5">
                  {FIRST_DAY_STEPS.map((step, index) => {
                    const isChecked = Boolean(checkedSteps[step.id]);
                    return (
                      <div
                        key={step.id}
                        onClick={() => toggleStep(step.id)}
                        className={`rounded-2xl border p-4 transition cursor-pointer flex items-start gap-3.5 ${
                          isChecked
                            ? 'bg-emerald-950/25 border-emerald-500/30'
                            : 'bg-slate-900/75 border-slate-800/90 hover:border-slate-700'
                        }`}
                      >
                        <button
                          type="button"
                          aria-label={`Отметить шаг ${index + 1}`}
                          className={`mt-0.5 w-6 h-6 rounded-lg border flex items-center justify-center shrink-0 transition ${
                            isChecked
                              ? 'bg-emerald-500 border-emerald-400 text-slate-950'
                              : 'bg-slate-950/70 border-slate-700 text-slate-400'
                          }`}
                        >
                          {isChecked ? (
                            <Icon name="check" className="w-4 h-4" />
                          ) : (
                            <span className="text-xs font-bold">{index + 1}</span>
                          )}
                        </button>

                        <div className="min-w-0 flex-1">
                          <div className="flex items-center gap-2 mb-1">
                            <Icon name={step.icon} className="w-4 h-4 text-purple-400" />
                            <h3
                              className={`text-sm font-semibold ${
                                isChecked ? 'line-through text-slate-400' : 'text-slate-100'
                              }`}
                            >
                              {step.title}
                            </h3>
                          </div>
                          <p className="text-xs text-slate-400 leading-relaxed">{step.desc}</p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>
            )}

            {/* SECTION: ROLES & ADMIN NOTES */}
            {activeTab === 'roles-admin' && (
              <section className="space-y-5">
                <div className="space-y-3">
                  <div className="rounded-2xl bg-slate-900/75 border border-slate-800/90 p-4">
                    <h2 className="text-base font-bold text-white flex items-center gap-2 mb-1">
                      <Icon name="users" className="w-5 h-5 text-purple-400" />
                      Роли для компании друзей
                    </h2>
                    <p className="text-xs text-slate-400">
                      Разделите направления, чтобы каждый закрывал свою ветку развития и помогал команде.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                    {ROLES_GUIDE.map((role) => (
                      <div
                        key={role.id}
                        className={`rounded-2xl border p-4 space-y-2 backdrop-blur-md ${role.color}`}
                      >
                        <div className="flex items-start justify-between gap-2">
                          <h3 className="text-sm font-bold text-white">{role.title}</h3>
                          <span className="shrink-0 whitespace-nowrap text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-950/70 text-slate-200 border border-white/10">
                            {role.badge}
                          </span>
                        </div>
                        <p className="text-xs text-slate-300 leading-relaxed">{role.tasks}</p>
                        <p className="text-[11px] text-slate-400 pt-1 border-t border-white/10">
                          <strong className="text-slate-200">Ключевые моды:</strong> {role.mods}
                        </p>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Admin notes */}
                <div className="rounded-2xl bg-slate-900/80 border border-slate-800/90 p-5 space-y-3 shadow-xl">
                  <h2 className="text-base font-bold text-white flex items-center gap-2">
                    <Icon name="wrench" className="w-5 h-5 text-amber-400" />
                    Заметки для администратора сервера
                  </h2>
                  <div className="space-y-2.5">
                    {ADMIN_NOTES.map((note, idx) => (
                      <div
                        key={idx}
                        className="rounded-xl bg-slate-950/70 border border-slate-800/90 p-3.5 flex items-start gap-3"
                      >
                        <Icon name="alert-triangle" className="w-4 h-4 text-amber-400 mt-0.5" />
                        <p className="text-xs text-slate-300 leading-relaxed">{note}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            )}

            {/* SECTION: FAQ */}
            {activeTab === 'faq' && (
              <section className="space-y-3">
                <div className="rounded-2xl bg-slate-900/75 border border-slate-800/90 p-4">
                  <h2 className="text-base font-bold text-white flex items-center gap-2 mb-1">
                    <Icon name="help-circle" className="w-5 h-5 text-purple-400" />
                    Частые вопросы (FAQ)
                  </h2>
                  <p className="text-xs text-slate-400">
                    Ответы на частые вопросы по выживанию, модам и производительности.
                  </p>
                </div>

                {FAQS.map((item, idx) => {
                  const isOpen = openFaq === idx;
                  return (
                    <div
                      key={idx}
                      className="rounded-2xl bg-slate-900/80 border border-slate-800/90 overflow-hidden"
                    >
                      <button
                        type="button"
                        onClick={() => setOpenFaq(isOpen ? null : idx)}
                        className="w-full p-4 text-left flex items-center justify-between gap-3 hover:bg-slate-800/40 transition"
                      >
                        <span className="text-sm font-semibold text-slate-100">{item.q}</span>
                        <Icon
                          name="chevron-down"
                          className={`w-4 h-4 text-slate-400 transition-transform ${
                            isOpen ? 'rotate-180 text-purple-400' : ''
                          }`}
                        />
                      </button>
                      {isOpen && (
                        <div className="px-4 pb-4 pt-3 text-xs text-slate-300 leading-relaxed border-t border-slate-800/70 bg-slate-950/35">
                          {item.a}
                        </div>
                      )}
                    </div>
                  );
                })}
              </section>
            )}
          </div>

          {/* MOD DETAIL MODAL */}
          {selectedMod && (
            <div
              onClick={() => setSelectedMod(null)}
              className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm p-4 flex items-center justify-center animate-fadeIn"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="w-full max-w-lg max-h-[85vh] overflow-y-auto rounded-2xl bg-slate-900 border border-slate-700/90 p-5 shadow-2xl relative space-y-4"
              >
                <button
                  type="button"
                  onClick={() => setSelectedMod(null)}
                  aria-label="Закрыть окно"
                  className="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white absolute top-4 right-4 transition"
                >
                  <Icon name="x" className="w-4 h-4" />
                </button>

                <div className="pr-10 space-y-1.5">
                  <div className="flex flex-wrap items-center gap-2">
                    <span
                      className={`text-[10px] font-semibold px-2.5 py-0.5 rounded-full border ${selectedMod.diffColor}`}
                    >
                      {selectedMod.difficulty}
                    </span>
                    <span className="text-xs font-medium text-purple-300">
                      {selectedMod.roleLabel}
                    </span>
                  </div>
                  <h2 className="text-lg sm:text-xl font-bold text-white leading-snug">
                    {selectedMod.title}
                  </h2>
                </div>

                <p className="text-xs text-slate-300 leading-relaxed rounded-xl bg-slate-950/60 border border-slate-800 p-3.5">
                  {selectedMod.summary}
                </p>

                <div className="space-y-1.5">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
                    <Icon name="zap" className="w-3.5 h-3.5" />
                    <span>С чего начать</span>
                  </h3>
                  <p className="text-xs text-slate-200 leading-relaxed rounded-xl bg-amber-500/10 border border-amber-500/25 p-3.5">
                    {selectedMod.startGuide}
                  </p>
                </div>

                <div className="space-y-2">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">
                    Детали и особенности
                  </h3>
                  <ul className="space-y-2">
                    {selectedMod.details.map((detail, i) => (
                      <li key={i} className="text-xs text-slate-300 flex items-start gap-2 leading-relaxed">
                        <Icon name="check-circle-2" className="w-4 h-4 text-purple-400 mt-0.5" />
                        <span>{detail}</span>
                      </li>
                    ))}
                  </ul>
                </div>

                <div className="pt-2 flex flex-wrap gap-2">
                  {selectedMod.wikiUrl && (
                    <a
                      href={selectedMod.wikiUrl}
                      target="_blank"
                      rel="noreferrer"
                      className="flex-1 min-w-[160px] py-2.5 px-4 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-semibold inline-flex items-center justify-center gap-1.5 transition"
                    >
                      <span>Открыть Wiki</span>
                      <Icon name="external-link" className="w-3.5 h-3.5" />
                    </a>
                  )}
                  <button
                    type="button"
                    onClick={() => setSelectedMod(null)}
                    className="py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold transition"
                  >
                    Закрыть
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootContainer = document.getElementById('root');
    ReactDOM.createRoot(rootContainer).render(<App />);
  </script>
</body>
</html>
