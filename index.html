<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Серверная сборка NeoForge 1.21.1 — Гайд</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-main: #0c0517;
      --bg-card: #170b2c;
      --bg-card-alt: #120722;
      --border-main: #2b144d;
      --neon-pink: #f000ff;
      --neon-purple: #a855f7;
      --neon-orange: #ff6b00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--bg-main);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-image:
        radial-gradient(circle at 15% 10%, rgba(240, 0, 255, 0.14), transparent 36%),
        radial-gradient(circle at 85% 12%, rgba(255, 107, 0, 0.14), transparent 38%),
        radial-gradient(circle at 50% 85%, rgba(168, 85, 247, 0.11), transparent 45%);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .neon-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-main);
      box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.7), 0 0 18px -8px rgba(240, 0, 255, 0.25);
    }

    .neon-card-orange {
      background: linear-gradient(135deg, rgba(255, 107, 0, 0.14), rgba(23, 11, 44, 0.96) 55%, rgba(240, 0, 255, 0.12));
      border: 1px solid rgba(255, 107, 0, 0.45);
      box-shadow: 0 0 24px -6px rgba(255, 107, 0, 0.35);
    }

    .neon-active-btn {
      background: linear-gradient(90deg, #d946ef, #ff6b00);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(240, 0, 255, 0.45);
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-fuchsia-500 selection:text-white">
  <div id="app" class="max-w-4xl mx-auto px-4 py-6 space-y-6"></div>

  <script>
    (function () {
      const TOTAL_MODS_COUNT = 163;

      const MOD_GROUPS = [
        {
          id: 1,
          title: "Военная форма и экипировка",
          category: "Оружие и Экипировка",
          count: 1,
          refine: true,
          mods: ["Russian Army Uniforms"],
          desc: "Комплекты военной формы, разгрузки и экипировки для тематических ролей и отрядов на сервере."
        },
        {
          id: 2,
          title: "Огнестрельное оружие и баллистика",
          category: "Оружие и Экипировка",
          count: 14,
          refine: true,
          mods: ["Timeless and Classics Zero (TaCZ)", "SecurityCraft", "Ballistics & Attachments", "Tactical Gear"],
          desc: "Огнестрел с обвесами, прицелами, боеприпасами, система защиты периметра и правила использования."
        },
        {
          id: 3,
          title: "Магия, заклинания и гримуары",
          category: "Магия",
          count: 18,
          refine: false,
          mods: ["Iron's Spells 'n Spellbooks", "Ars Nouveau", "Relics", "Artifacts", "Curios API"],
          desc: "Боевая и поддерживающая магия, школы заклинаний, артефакты, реликвии и слоты аксессуаров."
        },
        {
          id: 4,
          title: "Механика, заводы и энергия",
          category: "Техника и Космос",
          count: 24,
          refine: false,
          mods: ["Create", "Create Crafts & Additions", "Mekanism", "Applied Energistics 2", "Pipez"],
          desc: "Кинетические механизмы, конвейеры, автокрафт, МЭ-хранилища, переработка руд и логистика ресурсов."
        },
        {
          id: 5,
          title: "Транспорт, полёты и космос",
          category: "Техника и Космос",
          count: 15,
          refine: true,
          mods: ["Valkyrien Skies 2", "Eureka 2", "Steam 'n' Rails", "Ad Astra", "Simple Planes"],
          desc: "Подвижные конструкции, корабли, железные дороги, авиация и межпланетные полёты на копии мира."
        },
        {
          id: 6,
          title: "Генерация миров, биомы и данжи",
          category: "Мир и Сезоны",
          count: 22,
          refine: false,
          mods: ["Terralith", "Tectonic", "The Twilight Forest", "Deeper and Darker", "When Dungeons Arise", "Lootr"],
          desc: "Обновлённые ландшафты, высокие горы, глубокие пещеры, Сумеречный лес, крупные данжи и персональный лут."
        },
        {
          id: 7,
          title: "Времена года, природа и фауна",
          category: "Мир и Сезоны",
          count: 17,
          refine: false,
          mods: ["Serene Seasons", "Alex's Mobs", "AmbientSounds", "Biomes & Wildlife", "Farmer's Delight"],
          desc: "Смена сезонов, влияние климата на посевы, новые животные, атмосфера мира и расширенная кулинария."
        },
        {
          id: 8,
          title: "Монстры, боссы и сложность боя",
          category: "Монстры и Сложность",
          count: 16,
          refine: true,
          mods: ["Born in Chaos", "Zombie Apocalypse Addon", "Improved Mobs", "Hostile Tactics", "L_Ender 'Cataclysm'"],
          desc: "Усиленный ИИ врагов, опасные волны и боссы; при необходимости настройка сложности через /za и /za preset casual."
        },
        {
          id: 9,
          title: "Строительство, декор и мебель",
          category: "Строительство",
          count: 18,
          refine: false,
          mods: ["Chipped", "Macaw's Bridges", "Macaw's Roofs", "Handcrafted", "Supplementaries"],
          desc: "Вариативные блоки, мосты, крыши, уютная мебель, таблички, фонари и декоративные детали для баз."
        },
        {
          id: 10,
          title: "Интерфейс, карты, оптимизация и библиотеки",
          category: "Интерфейс и Утилиты",
          count: 16,
          refine: false,
          mods: ["JEI", "Jade", "JourneyMap", "Sodium / Embeddium", "NeoForge Libs"],
          desc: "Подсказки крафтов, информация о блоках и сущностях, карты, повышение FPS и базовые библиотеки сборки."
        }
      ];

      const ROLES_DATA = [
        {
          id: "explorer",
          title: "Следопыт и Исследователь миров",
          tag: "Мир, Данжи и Сезоны",
          desc: "Разведывает биомы, открывает порталы, ведёт группу через большие данжи и следит за календарём сезонов и сундуками Lootr.",
          keyMods: "Terralith, Tectonic, The Twilight Forest, Deeper and Darker, When Dungeons Arise, Lootr, Serene Seasons"
        },
        {
          id: "fighter",
          title: "Боец и Снабженец",
          tag: "Охрана, Оружие и Ресурсы",
          desc: "Держит оборону базы, ходит в опасные рейды, подбирает экипировку, боеприпасы и базовые припасы для всей команды.",
          keyMods: "Russian Army Uniforms, TaCZ, SecurityCraft, Iron's Spells 'n Spellbooks, Born in Chaos"
        },
        {
          id: "engineer",
          title: "Инженер и Строитель",
          tag: "Механика, Сети и База",
          desc: "Собирает механизмы, автоматизирует добычу и переработку, настраивает хранилища и обустраивает общую базу.",
          keyMods: "Create, Applied Energistics 2, Mekanism, Chipped, Handcrafted"
        }
      ];

      const FIRST_DAY_STEPS = [
        "Запустите клиент на NeoForge 1.21.1, проверьте синхронизацию сборки и зайдите на сервер.",
        "Добудьте стартовые ресурсы, поставьте укрытие и подготовьте спальное место до наступления ночи.",
        "Выберите роли в команде и распределите задачи по разведке, добыче и обустройству базы.",
        "Согласуйте общие правила по хранению вещей в сундуках, использованию оружия и защитных систем."
      ];

      const FAQ_ITEMS = [
        {
          q: "Какая версия загрузчика и модов используется?",
          a: "Сборка рассчитана на Minecraft с NeoForge 1.21.1 и включает 163 мода."
        },
        {
          q: "Как быстро найти нужный мод или роль?",
          a: "Воспользуйтесь строкой поиска сверху, выберите категорию в горизонтальной ленте или включите фильтр «Только «уточнить»»."
        },
        {
          q: "Что делать, если ночь или рейды стали слишком жёсткими?",
          a: "Обсудите с командой настройки сложности и при необходимости используйте команды /za и /za preset casual."
        }
      ];

      const ADMIN_NOTES = [
        { icon: "⚡", text: "Поддерживать сервер" },
        { icon: "❤️", text: "Любить своих игроков" },
        { icon: "🎉", text: "Получать удовольствие" }
      ];

      const CATEGORIES = [
        "Все",
        "Оружие и Экипировка",
        "Магия",
        "Техника и Космос",
        "Мир и Сезоны",
        "Монстры и Сложность",
        "Строительство",
        "Интерфейс и Утилиты"
      ];

      const state = {
        search: "",
        selectedCategory: "Все",
        onlyRefine: false
      };

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function getFilteredGroups() {
        const q = state.search.trim().toLowerCase();
        return MOD_GROUPS.filter(function (group) {
          const matchesCat = state.selectedCategory === "Все" || group.category === state.selectedCategory;
          const matchesRefine = !state.onlyRefine || group.refine;
          const matchesQuery =
            !q ||
            group.title.toLowerCase().includes(q) ||
            group.category.toLowerCase().includes(q) ||
            group.desc.toLowerCase().includes(q) ||
            group.mods.some(function (m) {
              return m.toLowerCase().includes(q);
            });
          return matchesCat && matchesRefine && matchesQuery;
        });
      }

      function render() {
        const root = document.getElementById("app");
        if (!root) return;

        const filteredGroups = getFilteredGroups();
        const coveredModsCount = Math.min(
          filteredGroups.reduce(function (acc, g) { return acc + g.count; }, 0),
          TOTAL_MODS_COUNT
        );

        const categoryButtonsHtml = CATEGORIES.map(function (cat) {
          const active = state.selectedCategory === cat;
          const cls = active
            ? "neon-active-btn"
            : "bg-[#120722] text-slate-300 border border-[#2b144d] hover:border-fuchsia-500/50 hover:text-white";
          return (
            '<button type="button" data-cat="' +
            escapeHtml(cat) +
            '" class="cat-btn shrink-0 whitespace-nowrap px-3.5 py-2 rounded-xl text-xs font-semibold transition ' +
            cls +
            '">' +
            escapeHtml(cat) +
            "</button>"
          );
        }).join("");

        const adminHtml = ADMIN_NOTES.map(function (note) {
          return (
            '<li class="flex items-center gap-3 rounded-xl bg-[#0c0517]/80 border border-orange-500/25 px-3.5 py-2.5">' +
            '<span class="text-base">' +
            escapeHtml(note.icon) +
            "</span>" +
            '<span class="font-medium">' +
            escapeHtml(note.text) +
            "</span>" +
            "</li>"
          );
        }).join("");

        const groupsHtml =
          filteredGroups.length === 0
            ? '<div class="neon-card rounded-2xl p-6 text-center text-sm text-slate-400">По выбранным фильтрам ничего не найдено. Нажмите «Сброс», чтобы вернуть все разделы.</div>'
            : '<div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">' +
              filteredGroups
                .map(function (group) {
                  const modChips = group.mods
                    .map(function (modName) {
                      return (
                        '<span class="text-[11px] px-2 py-0.5 rounded-md bg-[#0c0517] text-slate-200 border border-[#2b144d]">' +
                        escapeHtml(modName) +
                        "</span>"
                      );
                    })
                    .join("");

                  return (
                    '<article class="neon-card rounded-2xl p-4 flex flex-col justify-between gap-3">' +
                    '<div class="space-y-2">' +
                    '<div class="flex items-start justify-between gap-2">' +
                    '<h3 class="font-bold text-base text-fuchsia-300">' +
                    escapeHtml(group.title) +
                    "</h3>" +
                    '<span class="shrink-0 whitespace-nowrap text-[11px] font-semibold px-2.5 py-0.5 rounded-lg bg-[#0c0517] text-orange-300 border border-orange-500/35">' +
                    escapeHtml(String(group.count)) +
                    " мод.</span>" +
                    "</div>" +
                    '<div class="text-[11px] font-medium text-purple-300/90">' +
                    escapeHtml(group.category) +
                    "</div>" +
                    '<p class="text-xs text-slate-300/85 leading-relaxed">' +
                    escapeHtml(group.desc) +
                    "</p>" +
                    "</div>" +
                    '<div class="pt-2 border-t border-[#2b144d] flex flex-wrap gap-1.5">' +
                    modChips +
                    "</div>" +
                    "</article>"
                  );
                })
                .join("") +
              "</div>";

        const rolesHtml = ROLES_DATA.map(function (role) {
          return (
            '<div class="rounded-xl bg-[#120722] border border-[#2b144d] p-4 space-y-2">' +
            '<div class="inline-block text-[11px] font-semibold px-2 py-0.5 rounded bg-fuchsia-500/15 text-fuchsia-300 border border-fuchsia-500/30">' +
            escapeHtml(role.tag) +
            "</div>" +
            '<h3 class="font-bold text-sm text-slate-100">' +
            escapeHtml(role.title) +
            "</h3>" +
            '<p class="text-xs text-slate-300/85 leading-relaxed">' +
            escapeHtml(role.desc) +
            "</p>" +
            '<p class="text-[11px] text-orange-300/90 pt-1 border-t border-[#2b144d]"><strong>Ключевые моды:</strong> ' +
            escapeHtml(role.keyMods) +
            "</p>" +
            "</div>"
          );
        }).join("");

        const stepsHtml = FIRST_DAY_STEPS.map(function (step, idx) {
          return (
            '<li class="flex items-start gap-3 rounded-xl bg-[#120722] border border-[#2b144d] p-3 text-xs sm:text-sm text-slate-200">' +
            '<span class="shrink-0 w-6 h-6 rounded-lg bg-gradient-to-br from-fuchsia-500 to-orange-500 text-white font-bold text-xs flex items-center justify-center">' +
            String(idx + 1) +
            "</span>" +
            '<span class="leading-relaxed">' +
            escapeHtml(step) +
            "</span>" +
            "</li>"
          );
        }).join("");

        const faqHtml = FAQ_ITEMS.map(function (item) {
          return (
            '<div class="rounded-xl bg-[#120722] border border-[#2b144d] p-3.5 space-y-1">' +
            '<div class="font-semibold text-sm text-fuchsia-300">' +
            escapeHtml(item.q) +
            "</div>" +
            '<div class="text-xs text-slate-300/85 leading-relaxed">' +
            escapeHtml(item.a) +
            "</div>" +
            "</div>"
          );
        }).join("");

        const refineCls = state.onlyRefine
          ? "bg-orange-500/25 border-orange-400 text-orange-200"
          : "bg-[#120722] border-[#2b144d] text-amber-300 hover:border-orange-500/50";

        root.innerHTML =
          '<header class="neon-card rounded-2xl p-6 text-center space-y-2">' +
          '<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-fuchsia-500/15 text-fuchsia-300 border border-fuchsia-500/30">' +
          "<span>NeoForge 1.21.1</span><span>•</span><span>" +
          String(TOTAL_MODS_COUNT) +
          " модов</span></div>" +
          '<h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-fuchsia-400 via-pink-400 to-orange-400 bg-clip-text text-transparent">Серверная сборка NeoForge 1.21.1</h1>' +
          '<p class="text-sm text-slate-300/80 max-w-xl mx-auto">Гайд по сборке, ролям в команде, первому дню и основным разделам для игры с друзьями.</p>' +
          "</header>" +
          '<section class="neon-card rounded-2xl p-4 space-y-3">' +
          '<input id="search-input" type="text" value="' +
          escapeHtml(state.search) +
          '" placeholder="Поиск по модам, категориям, ролям и заметкам..." class="w-full rounded-xl bg-[#0c0517] border border-[#2b144d] px-4 py-2.5 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-fuchsia-500" />' +
          '<div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">' +
          categoryButtonsHtml +
          '<button id="reset-btn" type="button" title="Сбросить фильтры" class="shrink-0 whitespace-nowrap px-3 py-2 rounded-xl text-xs font-semibold bg-[#120722] text-orange-300 border border-orange-500/40 hover:bg-orange-500/15 transition">🧭 Сброс</button>' +
          '<button id="refine-btn" type="button" class="shrink-0 whitespace-nowrap px-3.5 py-2 rounded-xl text-xs font-semibold border transition ' +
          refineCls +
          '">Только «уточнить»</button>' +
          "</div>" +
          '<div class="flex flex-wrap items-center justify-between gap-2 pt-1 text-xs text-slate-400">' +
          '<span>Разделов найдено: <strong class="text-slate-200">' +
          String(filteredGroups.length) +
          "</strong></span>" +
          '<span>Охват сборки: <strong class="text-fuchsia-300">' +
          String(coveredModsCount) +
          " из " +
          String(TOTAL_MODS_COUNT) +
          "</strong></span>" +
          "</div>" +
          "</section>" +
          '<section class="neon-card-orange rounded-2xl p-5 space-y-3">' +
          '<div class="flex items-center gap-2"><span class="text-lg">🛠️</span><h2 class="text-base sm:text-lg font-bold text-orange-300">Заметки для администратора</h2></div>' +
          '<ul class="space-y-2 text-sm text-slate-100">' +
          adminHtml +
          "</ul>" +
          "</section>" +
          '<section class="space-y-3">' +
          '<div class="flex items-center justify-between"><h2 class="text-lg sm:text-xl font-bold text-slate-100">📦 Моды сборки (' +
          String(TOTAL_MODS_COUNT) +
          ")</h2></div>" +
          groupsHtml +
          "</section>" +
          '<section class="neon-card rounded-2xl p-5 space-y-3.5">' +
          '<h2 class="text-lg font-bold text-slate-100">👥 Роли в команде</h2>' +
          '<div class="grid grid-cols-1 md:grid-cols-3 gap-3">' +
          rolesHtml +
          "</div>" +
          "</section>" +
          '<section class="neon-card rounded-2xl p-5 space-y-3">' +
          '<h2 class="text-lg font-bold text-slate-100">🧭 Чек-лист первого дня</h2>' +
          '<ol class="space-y-2">' +
          stepsHtml +
          "</ol>" +
          "</section>" +
          '<section class="neon-card rounded-2xl p-5 space-y-3">' +
          '<h2 class="text-lg font-bold text-slate-100">❓ Частые вопросы</h2>' +
          '<div class="space-y-2.5">' +
          faqHtml +
          "</div>" +
          "</section>";

        bindEvents();
      }

      function bindEvents() {
        const searchInput = document.getElementById("search-input");
        if (searchInput) {
          searchInput.addEventListener("input", function (e) {
            state.search = e.target.value;
            render();
            const updated = document.getElementById("search-input");
            if (updated) {
              updated.focus();
              updated.setSelectionRange(updated.value.length, updated.value.length);
            }
          });
        }

        document.querySelectorAll(".cat-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            state.selectedCategory = btn.getAttribute("data-cat") || "Все";
            render();
          });
        });

        const resetBtn = document.getElementById("reset-btn");
        if (resetBtn) {
          resetBtn.addEventListener("click", function () {
            state.search = "";
            state.selectedCategory = "Все";
            state.onlyRefine = false;
            render();
          });
        }

        const refineBtn = document.getElementById("refine-btn");
        if (refineBtn) {
          refineBtn.addEventListener("click", function () {
            state.onlyRefine = !state.onlyRefine;
            render();
          });
        }
      }

      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", render);
      } else {
        render();
      }
    })();
  </script>
</body>
</html>
