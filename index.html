                      isActive
                        ? 'bg-gradient-to-r from-fuchsia-600 to-orange-500 text-white border-fuchsia-300/60 glow-pink'
                        : 'bg-[#170b2c]/90 text-slate-200 border-[#2b144d] hover:border-fuchsia-400/50 hover:text-white'
                    }`}
                  >
                    <span>{cat.icon}</span>
                    <span>{cat.label}</span>
                  </button>
                );
              })}

              {/* Reset button with compass icon */}
              <button
                type="button"
                onClick={handleResetFilters}
                className="shrink-0 whitespace-nowrap inline-flex items-center gap-1.5 px-3.5 py-2 rounded-2xl text-xs font-semibold bg-[#170b2c]/90 text-slate-200 border border-[#2b144d] hover:border-orange-400/60 hover:text-orange-200 transition"
              >
                <svg
                  className="w-3.5 h-3.5 text-orange-400"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="2"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="10" />
                  <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
                </svg>
                <span>Сброс</span>
              </button>

              {/* "Только «уточнить»" toggle */}
              <button
                type="button"
                onClick={() => setOnlyClarify((prev) => !prev)}
                className={`shrink-0 whitespace-nowrap inline-flex items-center gap-1.5 px-3.5 py-2 rounded-2xl text-xs font-semibold border transition ${
                  onlyClarify
                    ? 'bg-gradient-to-r from-orange-500 to-fuchsia-600 text-white border-orange-300/70 glow-orange'
                    : 'bg-[#170b2c]/90 text-amber-300 border-[#2b144d] hover:border-amber-400/50'
                }`}
              >
                <span>⭐</span>
                <span>Только «уточнить»</span>
              </button>
            </div>
          </section>

          {/* Section navigation tabs */}
          <nav aria-label="Разделы гайда" className="grid grid-cols-5 gap-1.5 p-1.5 rounded-2xl bg-[#170b2c]/95 border border-[#2b144d]">
            {navTabs.map((tab) => {
              const active = activeTab === tab.id && !normalizedQuery;
              return (
                <button
                  key={tab.id}
                  type="button"
                  onClick={() => {
                    setSearchQuery('');
                    setActiveTab(tab.id);
                  }}
                  className={`py-2 px-2 rounded-xl text-xs sm:text-sm font-semibold transition truncate ${
                    active
                      ? 'bg-gradient-to-r from-fuchsia-600 to-orange-500 text-white shadow-md'
                      : 'text-slate-300 hover:text-white hover:bg-white/5'
                  }`}
                >
                  {tab.label}
                </button>
              );
            })}
          </nav>

          {/* Cross-section search results mode */}
          {searchResults ? (
            <main className="space-y-6">
              <div className="flex items-center justify-between gap-3">
                <h2 className="text-base font-bold text-white">
                  Результаты поиска по запросу «{searchQuery.trim()}»
                </h2>
                <button
                  type="button"
                  onClick={() => setSearchQuery('')}
                  className="text-xs font-semibold text-fuchsia-300 hover:text-orange-300 transition"
                >
                  Сбросить поиск
                </button>
              </div>

              {searchResults.mods.length === 0 &&
              searchResults.roles.length === 0 &&
              searchResults.checklist.length === 0 &&
              searchResults.faq.length === 0 &&
              searchResults.admin.length === 0 ? (
                <div className="rounded-3xl bg-[#170b2c]/90 border border-[#2b144d] p-8 text-center space-y-2">
                  <p className="text-sm font-semibold text-white">Ничего не найдено</p>
                  <p className="text-xs text-slate-400">
                    Попробуйте другой запрос или нажмите «Сброс», чтобы вернуть все фильтры.
                  </p>
                </div>
              ) : (
                <div className="space-y-6">
                  {searchResults.mods.length > 0 && (
                    <section className="space-y-3">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-fuchsia-300">
                        Моды ({searchResults.mods.length})
                      </h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {searchResults.mods.map((mod) => (
                          <ModCard key={mod.id} mod={mod} onSelect={setSelectedMod} />
                        ))}
                      </div>
                    </section>
                  )}

                  {searchResults.roles.length > 0 && (
                    <section className="space-y-3">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-orange-300">
                        Роли в команде ({searchResults.roles.length})
                      </h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {searchResults.roles.map((role) => (
                          <RoleCard key={role.id} role={role} />
                        ))}
                      </div>
                    </section>
                  )}

                  {searchResults.checklist.length > 0 && (
                    <section className="space-y-3">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-fuchsia-300">
                        Первый день ({searchResults.checklist.length})
                      </h3>
                      <div className="space-y-2.5">
                        {searchResults.checklist.map((item) => (
                          <ChecklistItem key={item.step} item={item} />
                        ))}
                      </div>
                    </section>
                  )}

                  {searchResults.admin.length > 0 && (
                    <section className="space-y-3">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-orange-300">
                        Заметки для администратора сервера ({searchResults.admin.length})
                      </h3>
                      <AdminNotesCard notes={searchResults.admin} />
                    </section>
                  )}

                  {searchResults.faq.length > 0 && (
                    <section className="space-y-3">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-fuchsia-300">
                        FAQ ({searchResults.faq.length})
                      </h3>
                      <FaqList
                        items={searchResults.faq}
                        openIndex={openFaqIndex}
                        onToggle={(idx) => setOpenFaqIndex(openFaqIndex === idx ? null : idx)}
                      />
                    </section>
                  )}
                </div>
              )}
            </main>
          ) : (
            <main className="space-y-5">
              {/* TAB: MODS */}
              {activeTab === 'mods' && (
                <section className="space-y-4">
                  <div className="flex items-center justify-between text-xs text-slate-300 px-1">
                    <span>
                      Найдено модов: <strong className="text-white">{visibleMods.length}</strong>
                    </span>
                    <span className="text-fuchsia-300/90">Нажмите на карточку для подсказки старта</span>
                  </div>

                  {visibleMods.length === 0 ? (
                    <div className="rounded-3xl bg-[#170b2c]/90 border border-[#2b144d] p-8 text-center space-y-3">
                      <p className="text-sm font-semibold text-white">Под выбранные фильтры модов нет</p>
                      <button
                        type="button"
                        onClick={handleResetFilters}
                        className="inline-flex items-center gap-1.5 px-4 py-2 rounded-2xl text-xs font-semibold bg-gradient-to-r from-fuchsia-600 to-orange-500 text-white"
                      >
                        Сбросить фильтры
                      </button>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {visibleMods.map((mod) => (
                        <ModCard key={mod.id} mod={mod} onSelect={setSelectedMod} />
                      ))}
                    </div>
                  )}
                </section>
              )}

              {/* TAB: ROLES */}
              {activeTab === 'roles' && (
                <section className="space-y-4">
                  <div className="rounded-3xl bg-[#170b2c]/95 border border-[#2b144d] p-5 space-y-1">
                    <h2 className="text-base sm:text-lg font-bold text-white">Роли в команде друзей</h2>
                    <p className="text-xs sm:text-sm text-slate-300">
                      Выберите направление по душе, чтобы быстрее освоить сборку и закрывать разные задачи сервера.
                    </p>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {ROLES.map((role) => (
                      <RoleCard key={role.id} role={role} />
                    ))}
                  </div>
                </section>
              )}

              {/* TAB: DAY 1 */}
              {activeTab === 'day1' && (
                <section className="space-y-4">
                  <div className="rounded-3xl bg-[#170b2c]/95 border border-[#2b144d] p-5 space-y-1 glow-orange">
                    <h2 className="text-base sm:text-lg font-bold text-white">Чек-лист первого дня</h2>
                    <p className="text-xs sm:text-sm text-slate-300">
                      Простые шаги для спокойного старта на сервере NeoForge 1.21.1.
                    </p>
                  </div>
                  <div className="space-y-3">
                    {FIRST_DAY_CHECKLIST.map((item) => (
                      <ChecklistItem key={item.step} item={item} />
                    ))}
                  </div>
                </section>
              )}

              {/* TAB: ADMIN */}
              {activeTab === 'admin' && (
                <section className="space-y-4">
                  <AdminNotesCard notes={ADMIN_NOTES} />
                </section>
              )}

              {/* TAB: FAQ */}
              {activeTab === 'faq' && (
                <section className="space-y-4">
                  <div className="rounded-3xl bg-[#170b2c]/95 border border-[#2b144d] p-5 space-y-1">
                    <h2 className="text-base sm:text-lg font-bold text-white">Частые вопросы (FAQ)</h2>
                    <p className="text-xs sm:text-sm text-slate-300">
                      Ответы на основные вопросы по запуску, выживанию и механикам сервера.
                    </p>
                  </div>
                  <FaqList
                    items={FAQS}
                    openIndex={openFaqIndex}
                    onToggle={(idx) => setOpenFaqIndex(openFaqIndex === idx ? null : idx)}
                  />
                </section>
              )}
            </main>
          )}

          {/* Mod details modal */}
          {selectedMod && (
            <div
              role="dialog"
              aria-modal="true"
              aria-labelledby="mod-modal-title"
              onClick={() => setSelectedMod(null)}
              className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm p-4 flex items-center justify-center"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="w-full max-w-lg rounded-3xl bg-[#170b2c] border border-fuchsia-500/45 p-5 sm:p-6 space-y-4 glow-pink"
              >
                <div className="flex items-start justify-between gap-3">
                  <div className="space-y-1">
                    <span className="inline-block text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-fuchsia-500/15 text-fuchsia-300 border border-fuchsia-500/30">
                      {selectedMod.categoryLabel} • {selectedMod.difficulty}
                    </span>
                    <h2 id="mod-modal-title" className="text-lg font-extrabold text-white">
                      {selectedMod.title}
                    </h2>
                  </div>
                  <button
                    type="button"
                    onClick={() => setSelectedMod(null)}
                    aria-label="Закрыть окно"
                    className="p-2 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 transition"
                  >
                    ✕
                  </button>
                </div>

                <p className="text-sm text-slate-200 leading-relaxed rounded-2xl bg-[#0c0517]/85 border border-[#2b144d] p-4">
                  {selectedMod.summary}
                </p>

                <div className="rounded-2xl bg-orange-500/10 border border-orange-500/35 p-4 space-y-1.5">
                  <div className="text-xs font-bold uppercase tracking-wider text-orange-300">
                    С чего начать
                  </div>
                  <p className="text-xs sm:text-sm text-slate-100 leading-relaxed">
                    {selectedMod.startGuide}
                  </p>
                </div>

                <button
                  type="button"
                  onClick={() => setSelectedMod(null)}
                  className="w-full py-2.5 px-4 rounded-2xl text-sm font-bold bg-gradient-to-r from-fuchsia-600 to-orange-500 text-white hover:opacity-95 transition"
                >
                  Понятно
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ModCard({ mod, onSelect }) {
      const isOrangeAccent = mod.category === 'tech' || mod.category === 'gear' || mod.needsClarify;
      return (
        <article
          onClick={() => onSelect(mod)}
          className={`group rounded-3xl bg-[#170b2c]/95 border border-[#2b144d] p-4 sm:p-5 flex flex-col justify-between gap-4 cursor-pointer transition hover:-translate-y-0.5 ${
            isOrangeAccent
              ? 'hover:border-orange-400/60 hover:glow-orange'
              : 'hover:border-fuchsia-400/60 hover:glow-pink'
          }`}
        >
          <div className="space-y-2">
            <div className="flex items-start justify-between gap-2">
              <h3 className="text-sm sm:text-base font-bold text-white group-hover:text-fuchsia-200 transition">
                {mod.title}
              </h3>
              <span
                className={`shrink-0 text-[11px] font-semibold px-2.5 py-0.5 rounded-full border ${
                  mod.needsClarify
                    ? 'bg-orange-500/20 text-orange-200 border-orange-400/40'
                    : 'bg-fuchsia-500/15 text-fuchsia-200 border-fuchsia-400/30'
                }`}
              >
                {mod.difficulty}
              </span>
            </div>
            <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">{mod.summary}</p>
          </div>

          <div className="pt-3 border-t border-[#2b144d] flex items-center justify-between text-xs">
            <span className="text-slate-400 font-medium">{mod.categoryLabel}</span>
            <span className="font-semibold text-orange-300 group-hover:text-fuchsia-300 transition">
              Подробнее →
            </span>
          </div>
        </article>
      );
    }

    function RoleCard({ role }) {
      const isPink = role.accent === 'pink';
      return (
        <article
          className={`rounded-3xl bg-[#170b2c]/95 border border-[#2b144d] p-5 space-y-3 ${
            isPink ? 'hover:border-fuchsia-400/50 glow-pink' : 'hover:border-orange-400/50 glow-orange'
          }`}
        >
          <div className="flex items-start justify-between gap-2">
            <h3 className="text-base font-extrabold text-white">{role.title}</h3>
            <span
              className={`shrink-0 text-[11px] font-semibold px-2.5 py-0.5 rounded-full border ${
                isPink
                  ? 'bg-fuchsia-500/15 text-fuchsia-200 border-fuchsia-400/35'
                  : 'bg-orange-500/15 text-orange-200 border-orange-400/35'
              }`}
            >
              {role.badge}
            </span>
          </div>
          <p className="text-xs sm:text-sm text-slate-200 leading-relaxed">{role.description}</p>
          <div className="pt-2.5 border-t border-[#2b144d] text-xs text-slate-300 leading-relaxed">
            <span className="font-semibold text-fuchsia-300">Ключевые моды: </span>
            <span>{role.keyMods}</span>
          </div>
        </article>
      );
    }

    function ChecklistItem({ item }) {
      return (
        <div className="rounded-2xl bg-[#170b2c]/95 border border-[#2b144d] p-4 flex items-start gap-3.5">
          <div className="shrink-0 w-9 h-9 rounded-2xl bg-gradient-to-br from-fuchsia-600 to-orange-500 text-white font-extrabold text-xs flex items-center justify-center">
            {item.step}
          </div>
          <div className="space-y-1">
            <h3 className="text-sm font-bold text-white">{item.title}</h3>
            <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">{item.text}</p>
          </div>
        </div>
      );
    }

    function AdminNotesCard({ notes }) {
      return (
        <div className="rounded-3xl bg-[#170b2c]/95 border border-fuchsia-500/40 p-5 sm:p-6 space-y-4 glow-pink">
          <div className="space-y-1">
            <h2 className="text-base sm:text-lg font-extrabold text-white">
              Заметки для администратора сервера
            </h2>
            <p className="text-xs text-slate-300">Главные ориентиры для уютного сервера с друзьями.</p>
          </div>
          <ul className="space-y-2.5">
            {notes.map((note, idx) => (
              <li
                key={idx}
                className="rounded-2xl bg-[#0c0517]/90 border border-[#2b144d] px-4 py-3 text-sm font-semibold text-white flex items-center gap-3"
              >
                <span className="w-2.5 h-2.5 rounded-full bg-gradient-to-r from-fuchsia-400 to-orange-400 shrink-0" />
                <span>{note}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function FaqList({ items, openIndex, onToggle }) {
      return (
        <div className="space-y-2.5">
          {items.map((item, idx) => {
            const isOpen = openIndex === idx;
            return (
              <div
                key={item.q}
                className="rounded-2xl bg-[#170b2c]/95 border border-[#2b144d] overflow-hidden"
              >
                <button
                  type="button"
                  onClick={() => onToggle(idx)}
                  aria-expanded={isOpen}
                  className="w-full px-4 py-3.5 text-left flex items-center justify-between gap-3 text-xs sm:text-sm font-bold text-white hover:bg-white/5 transition"
                >
                  <span>{item.q}</span>
                  <span className="shrink-0 text-fuchsia-300 text-xs">{isOpen ? '▲' : '▼'}</span>
                </button>
                {isOpen && (
                  <div className="px-4 pb-4 pt-1 text-xs sm:text-sm text-slate-300 leading-relaxed border-t border-[#2b144d]/70">
                    {item.a}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
