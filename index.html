      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function getFilteredItems() {
        const q = state.search.trim().toLowerCase();
        return MOD_ITEMS.filter(function (item) {
          const matchesCat = state.selectedCategory === "Все" || item.category === state.selectedCategory;
          const matchesRefine = !state.onlyRefine || item.refine;
          const matchesQuery =
            !q ||
            item.name.toLowerCase().includes(q) ||
            item.section.toLowerCase().includes(q) ||
            item.category.toLowerCase().includes(q) ||
            item.whatItDoes.toLowerCase().includes(q) ||
            item.howToStart.toLowerCase().includes(q);
          return matchesCat && matchesRefine && matchesQuery;
        });
      }

            escapeHtml(role.title) +
            "</h3>" +
            '<p class="text-[11px] text-orange-300/90 pt-1 border-t border-[#2b144d]"><strong>Главные моды:</strong> ' +
            escapeHtml(role.mods) +
            "</p>" +
            "</div>"
          );
        }).join("");

        const stepsHtml = FIRST_DAY_STEPS.map(function (step, idx) {
          return (
            '<li class="flex items-start gap-3 rounded-xl bg-[#120722] border border-[#2b144d] p-3 text-xs sm:text-sm text-slate-200">' +
            '<span class="shrink-0 w-6 h-6 rounded-lg bg-gradient-to-br from-fuchsia-500 to-orange-500 text-white font-bold text-xs flex items-center justify-center">' +
            String(idx + 1) +
            "</span>" +
            '<span class="leading-relaxed">' +
            escapeHtml(step) +
            "</span>" +
            "</li>"
          );
        }).join("");

        const faqHtml = FAQ_ITEMS.map(function (item) {
          return (
            '<div class="rounded-xl bg-[#120722] border border-[#2b144d] p-3.5 space-y-1">' +
            '<div class="font-semibold text-sm text-fuchsia-300">' +
            escapeHtml(item.q) +
            "</div>" +
            '<div class="text-xs text-slate-300/90 leading-relaxed">' +
            escapeHtml(item.a) +
            "</div>" +
            "</div>"
          );
        }).join("");

        const refineCls = state.onlyRefine
          ? "bg-orange-500/25 border-orange-400 text-orange-200"
          : "bg-[#120722] border-[#2b144d] text-amber-300 hover:border-orange-500/50";

        return (
          '<section class="neon-card rounded-2xl p-4 space-y-3">' +
          '<input id="search-input" type="text" value="' +
          escapeHtml(state.search) +
          '" placeholder="Поиск по моду, разделу, действию, ролям и подсказкам..." class="w-full rounded-xl bg-[#0c0517] border border-[#2b144d] px-4 py-2.5 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-fuchsia-500" />' +
          '<div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">' +
          categoryButtonsHtml +
          '<button id="reset-btn" type="button" title="Сбросить фильтры" class="shrink-0 whitespace-nowrap px-3 py-2 rounded-xl text-xs font-semibold bg-[#120722] text-orange-300 border border-orange-500/40 hover:bg-orange-500/15 transition">🧭 Сброс</button>' +
          '<button id="refine-btn" type="button" class="shrink-0 whitespace-nowrap px-3.5 py-2 rounded-xl text-xs font-semibold border transition ' +
          refineCls +
          '">Только «уточнить»</button>' +
          "</div>" +
          '<div class="flex flex-wrap items-center justify-between gap-2 pt-1 text-xs text-slate-400">' +
          '<span>Показано карточек: <strong class="text-slate-200">' +
          String(filteredItems.length) +
          "</strong> из <strong class=\"text-slate-200\">" +
          String(totalCards) +
          "</strong> записей гайда</span>" +
          '<span>Всего файлов в сборке: <strong class="text-fuchsia-300">' +
          String(TOTAL_MODS_COUNT) +
          "</strong> (клиент и сервер)</span>" +
          "</div>" +
          "</section>" +
          '<section class="space-y-3">' +
          '<div class="flex flex-wrap items-baseline justify-between gap-2">' +
          '<h2 class="text-lg sm:text-xl font-bold text-slate-100">📦 Моды сборки</h2>' +
          '<span class="text-xs text-slate-400">' +
          String(filteredItems.length) +
          " карточек в выборке • часть карточек групповая/библиотечная из " +
          String(TOTAL_MODS_COUNT) +
          " файлов сборки</span>" +
          "</div>" +
          cardsHtml +
          "</section>" +
          '<section class="neon-card rounded-2xl p-5 space-y-3.5">' +
          '<h2 class="text-lg font-bold text-slate-100">👥 Роли в команде</h2>' +
          '<p class="text-xs text-slate-300/90">Идти по всему сразу не нужно: выберите одно занятие, а с друзьями разделите роли.</p>' +
          '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">' +
          rolesHtml +
          "</div>" +
          "</section>" +
          '<section class="neon-card rounded-2xl p-5 space-y-3">' +
          '<h2 class="text-lg font-bold text-slate-100">🧭 Первый день новичка</h2>' +
          '<ol class="space-y-2">' +
          stepsHtml +
          "</ol>" +
          "</section>" +
          '<section class="neon-card rounded-2xl p-5 space-y-3">' +
          '<h2 class="text-lg font-bold text-slate-100">❓ Частые вопросы</h2>' +
          '<div class="space-y-2.5">' +
          faqHtml +
          "</div>" +
          "</section>"
        );
      }

      function render() {
        const root = document.getElementById("app");
        if (!root) return;

        const playersTabCls =
          state.mode === "players"
            ? "neon-active-btn"
            : "bg-[#120722] text-slate-300 border border-[#2b144d] hover:border-fuchsia-500/50 hover:text-white";

        const adminTabCls =
          state.mode === "admin"
            ? "bg-gradient-to-r from-orange-500 to-amber-500 text-slate-950 font-extrabold shadow-[0_0_16px_rgba(255,107,0,0.45)]"
            : "bg-[#120722] text-orange-300 border border-orange-500/35 hover:bg-orange-500/15";

        const bodyContent = state.mode === "admin" ? renderAdminView() : renderPlayersView();

        root.innerHTML =
          '<header class="neon-card rounded-2xl p-6 text-center space-y-3">' +
          '<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-fuchsia-500/15 text-fuchsia-300 border border-fuchsia-500/30">' +
          "<span>NeoForge 1.21.1</span><span>•</span><span>" +
          String(TOTAL_MODS_COUNT) +
          " файлов (клиент и сервер)</span><span>•</span><span>" +
          String(MOD_ITEMS.length) +
          " карточек</span></div>" +
          '<h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-fuchsia-400 via-pink-400 to-orange-400 bg-clip-text text-transparent">Гайд по нашей сборке Minecraft (NeoForge 1.21.1)</h1>' +
          '<p class="text-sm text-slate-300/90 max-w-2xl mx-auto leading-relaxed">Это большое приключенческое выживание для компании: магия, механизмы, корабли, новые миры, опасные монстры, кухня и стройка. Идти по всему сразу не нужно: выберите одно занятие, а с друзьями разделите роли.</p>' +
          '<p class="text-[11px] text-slate-400 max-w-2xl mx-auto leading-relaxed">Клавиши указаны стандартные, в нашей сборке они могут быть изменены. Известные моды описаны по общим знаниям о них, и в вашей версии детали могут отличаться. Редкие моды по возможности проверены в интернете. Пометка (уточнить) значит, что описание не подтверждено.</p>' +
          '<div class="pt-1 flex items-center justify-center gap-2">' +
          '<button id="mode-players-btn" type="button" class="shrink-0 whitespace-nowrap px-4 py-2 rounded-xl text-xs font-semibold transition ' +
          playersTabCls +
          '">🎮 Игрокам</button>' +
          '<button id="mode-admin-btn" type="button" class="shrink-0 whitespace-nowrap px-4 py-2 rounded-xl text-xs font-semibold transition ' +
          adminTabCls +
          '">🛠️ Админу</button>' +
          "</div>" +
          "</header>" +
          bodyContent;

        bindEvents();
      }

      function bindEvents() {
        const modePlayersBtn = document.getElementById("mode-players-btn");
        if (modePlayersBtn) {
          modePlayersBtn.addEventListener("click", function () {
            state.mode = "players";
            render();
          });
        }

        const modeAdminBtn = document.getElementById("mode-admin-btn");
        if (modeAdminBtn) {
          modeAdminBtn.addEventListener("click", function () {
            state.mode = "admin";
            render();
          });
        }

        const searchInput = document.getElementById("search-input");
        if (searchInput) {
          searchInput.addEventListener("input", function (e) {
            state.search = e.target.value;
            render();
            const updated = document.getElementById("search-input");
            if (updated) {
              updated.focus();
              updated.setSelectionRange(updated.value.length, updated.value.length);
            }
          });
        }

        document.querySelectorAll(".cat-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            state.selectedCategory = btn.getAttribute("data-cat") || "Все";
            render();
          });
        });

        const resetBtn = document.getElementById("reset-btn");
        if (resetBtn) {
          resetBtn.addEventListener("click", function () {
            state.search = "";
            state.selectedCategory = "Все";
            state.onlyRefine = false;
            render();
          });
        }

        const refineBtn = document.getElementById("refine-btn");
        if (refineBtn) {
          refineBtn.addEventListener("click", function () {
            state.onlyRefine = !state.onlyRefine;
            render();
          });
        }
      }

      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", render);
      } else {
        render();
      }
    })();
  </script>
</body>
</html>
